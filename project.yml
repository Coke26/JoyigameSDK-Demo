name: JoyigameSDKDemo
fileGroups:
  - AdjustProfiles
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  JoyigameSDKDemo:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Select and validate Adjust profile
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          /usr/bin/python3 "$SRCROOT/tools/adjust_profiles.py" \
            --profiles-dir "$SRCROOT/AdjustProfiles" \
            --bundle-id "$PRODUCT_BUNDLE_IDENTIFIER" \
            --configuration "$CONFIGURATION" \
            --resources-dir "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/JoyiAdjustProfile.json"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/JoyiAdjustProfileSummary.json"
    sources:
      - JoyigameSDKDemo
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_CXX_LIBRARY: libc++
        INFOPLIST_FILE: JoyigameSDKDemo/Info.plist
        CODE_SIGN_ENTITLEMENTS: JoyigameSDKDemo/JoyigameSDKDemo.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "/usr/lib/swift"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.joyigame.demo
    dependencies:
      - sdk: libc++.tbd
      - sdk: libc++abi.tbd
      - sdk: Accelerate.framework
  JoyigameSDKDemoIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JoyigameSDKDemoIntegrationTests
    dependencies:
      - target: JoyigameSDKDemo
schemes:
  JoyigameSDKDemo:
    build:
      targets:
        JoyigameSDKDemo: all
        JoyigameSDKDemoIntegrationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JoyigameSDKDemoIntegrationTests
