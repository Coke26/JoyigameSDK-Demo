name: JoyigameSDKDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "13.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
targets:
  JoyigameSDKDemo:
    type: application
    platform: iOS
    sources:
      - JoyigameSDKDemo
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_CXX_LIBRARY: libc++
        INFOPLIST_FILE: JoyigameSDKDemo/Info.plist
        CODE_SIGN_ENTITLEMENTS: JoyigameSDKDemo/JoyigameSDKDemo.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "/usr/lib/swift"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.joyigame.demo
    dependencies:
      - sdk: libc++.tbd
      - sdk: libc++abi.tbd
      - sdk: Accelerate.framework
  JoyigameSDKDemoIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JoyigameSDKDemoIntegrationTests
    dependencies:
      - target: JoyigameSDKDemo
schemes:
  JoyigameSDKDemo:
    build:
      targets:
        JoyigameSDKDemo: all
        JoyigameSDKDemoIntegrationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JoyigameSDKDemoIntegrationTests
